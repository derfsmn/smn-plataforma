# Entorno local de desarrollo: SQL Server + API (FastAPI) + web (Next.js)
# Uso: copia entorno.ejemplo como .env y ejecuta: docker compose up --build

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_datos:/var/opt/mssql

  api:
    build: ./api
    env_file: .env
    environment:
      BD_SERVIDOR: sqlserver
      ARCHIVOS_RUTA: /datos/archivos
    ports:
      - "8000:8000"
    volumes:
      - archivos:/datos/archivos
    # Para que la API alcance Ollama corriendo en tu equipo (Windows/Mac ya lo traen; esto lo agrega en Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sqlserver
      - correo

  # Buzón de prueba: atrapa todos los correos de la plataforma; nada sale a internet.
  # Bandeja en http://localhost:8025
  correo:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sqlserver_datos:
  archivos:
